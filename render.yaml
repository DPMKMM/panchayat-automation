services:
  - type: web
    name: prkmm
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: WEB_SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /tmp/khammam-attendance-data
      - key: MAX_UPLOAD_BYTES
        value: "31457280"
      - key: DCB_PORTAL_PROXY_URL
        sync: false
      - key: DCB_PORTAL_PROXY_TOKEN
        sync: false
