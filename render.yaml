services:
  - type: web
    name: panchayat-automation
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: WEB_SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /tmp/epanchayat-attendance-data
      - key: MAX_UPLOAD_BYTES
        value: "31457280"
